name: fitlog
description: "FitLog — A premium workout tracking application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # Utilities
  shared_preferences: ^2.3.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # ── Lao Font Configuration Template ───────────────────────────────────
  # ເມື່ອເຈົ້າເອົາຟອນທ໌ (.ttf ຫຼື .otf) ມາໃສ່ໃນ assets/fonts/ ແລ້ວ
  # ໃຫ້ມາເປີດຄອມເມັ້ນ (uncomment) ຢູ່ບ່ອນນີ້ ແລະ ປ່ຽນຊື່ໄຟລ໌ໃຫ້ຖືກຕ້ອງ:
  #
  # fonts:
  #   - family: NotoSansLao
  #     fonts:
  #       - asset: assets/fonts/NotoSansLao-Regular.ttf
  #       - asset: assets/fonts/NotoSansLao-Bold.ttf
  #         weight: 700
  #

  fonts:
    - family: HinsiewLAO
      fonts:
        - asset: assets/fonts/Hinsiew-SemiBold.otf
        - asset: assets/fonts/Hinsiew-SemiBold.otf
          weight: 700
  